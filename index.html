<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <nav class="p-[24px] flex flex-col">
      <navbar
        class="bg-white rounded-full py-[12px] px-[80px] flex justify-between border">
        <img src="logo.png" alt="Acme Logo" />
        <wrapper class="flex justify-between gap-[32px]">
          <a href="#" class="text-indigo-600 font-medium underline underline-offset-4"
            >Home</a
          >
          <a href="#" class="text-slate-900 font-medium"
            >Features</a
          >
          <a href="#" class="text-slate-900 font-medium"
            >Pricing</a
          >
          <a href="#" class="text-slate-900 font-medium"
            >Contact</a
          >
        </wrapper>
      </navbar>
      <hero class="flex flex-col gap-[40px] items-center text-center pt-[120px] pr-[120px] pb-[140px] pl-[120px]">
        <div class="bg-indigo-100 rounded-full px-[20px] py-[8px]">
          <p class="text-indigo-600 font-medium text-[16px]">
            🌈️ Acme Productivity App
          </p>
        </div>
        <div>
          <h1
            class="text-[80px] font-bold text-black mb-[24px]"
          >
            Boost Your
            <span class="text-indigo-600">Productivity</span>
          </h1>
          <h3 class="text-[24px] leading-relaxed">
            Streamline your workflow with our all-in-one productivity app.
          </h3>
        </div>
        <button
          class="bg-black text-white font-medium text-[16px] rounded-[16px] px-[36px] py-[16px]"
        >
          Start Free Trial
        </button>
      </hero>
    </nav>
  </body>
</html>
